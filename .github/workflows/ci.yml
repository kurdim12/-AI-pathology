name: CI

# Smoke-tests the Naseej pipeline on every push / PR. Runs on CPU with
# randomly initialised weights and no dataset, so it stays fast and needs no
# downloads or secrets — it just proves the moving parts still fit together.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch wheels keep the job light and avoid CUDA downloads.
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pillow scikit-learn matplotlib tqdm pytest
          # Optional API deps so tests/test_api.py runs instead of skipping.
          pip install fastapi "uvicorn[standard]" python-multipart httpx

      - name: Verify modules import
        run: |
          python -c "import config; from src import model, data, gradcam, inference, triage, train, evaluate, calibrate, robustness, report, phone_sim, temperature; print('imports ok')"

      - name: Run test suite
        run: python -m pytest tests/ -q

      - name: End-to-end (binary) on synthetic data (no downloads)
        run: |
          # 'easy' difficulty keeps CI fast and deterministic; the 'realistic'
          # preset (overlapping classes + label noise) is for believable metrics.
          python -m scripts.make_demo_data --difficulty easy --per-class 40
          python -m src.train --no-pretrained --epochs 1 --backbone resnet18
          python -m src.evaluate
          python -m src.calibrate --target-sensitivity 0.95
          python -m src.calibrate --target-sensitivity 0.95 --robust 0.5
          python -m src.robustness --severities 0,0.5,1.0
          python -m src.triage data/train --csv outputs/worklist.csv
          test -f outputs/thresholds.json && test -f outputs/worklist.csv && test -f outputs/robustness.json && echo "binary pipeline ok"

      - name: End-to-end (multi-class subtype grading)
        run: |
          rm -rf data checkpoints outputs
          python -m scripts.make_demo_data --multiclass --difficulty easy --per-class 40
          python -m src.train --no-pretrained --epochs 1 --backbone resnet18
          python -m src.evaluate
          python -m src.triage data/train --csv outputs/worklist.csv
          test -f outputs/confusion_matrix_subtypes.png && echo "multi-class pipeline ok"
