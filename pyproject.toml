[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "naseej"
version = "0.1.0"
description = "AI pathology triage for labs without a whole-slide scanner — phone-photo-robust benign/malignant triage with explainability."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Naseej contributors" }]
keywords = ["pathology", "histopathology", "triage", "medical-imaging", "deep-learning", "breast-cancer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core runtime dependencies, with lower bounds AND upper bounds so a future
# major release can't silently break a deployment.
dependencies = [
    "torch>=2.0,<3.0",
    "torchvision>=0.15,<1.0",
    "numpy>=1.23,<3.0",
    "pillow>=9.0,<12.0",
    "scikit-learn>=1.1,<2.0",
    "matplotlib>=3.5,<4.0",
    "tqdm>=4.64,<5.0",
]

[project.optional-dependencies]
demo = ["gradio>=4.0,<6.0"]
api = ["fastapi>=0.110,<1.0", "uvicorn[standard]>=0.27,<1.0", "python-multipart>=0.0.9"]
foundation = ["timm>=0.9,<2.0"]
test = ["pytest>=7.0,<9.0", "httpx>=0.27,<1.0"]
dev = ["ruff>=0.4,<1.0", "pre-commit>=3.0,<5.0", "pytest>=7.0,<9.0", "httpx>=0.27,<1.0"]

[project.urls]
Homepage = "https://github.com/kurdim12/naseej"
Repository = "https://github.com/kurdim12/naseej"

# Console entry-points so the tools are runnable as `naseej-*` after install.
[project.scripts]
naseej-train = "src.train:_cli"
naseej-eval = "src.evaluate:_cli"
naseej-calibrate = "src.calibrate:main"
naseej-triage = "src.triage:main"
naseej-robustness = "src.robustness:_cli"
naseej-demo = "scripts.demo:main"

[tool.setuptools]
# Flat layout: the package lives in src/ + app/ + scripts/ + config.py.
py-modules = ["config"]

[tool.setuptools.packages.find]
include = ["src*", "app*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Sensible default set; keep it pragmatic for a research codebase.
select = ["E", "F", "I", "W", "UP", "B"]
ignore = [
    "E501",   # line length handled by formatter / not enforced hard
    "B008",   # function calls in argument defaults (argparse patterns)
    "B905",   # zip() strict= — not always desired; adds noise here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# These modules intentionally import after a guard / sys.path tweak.
"app/app.py" = ["E402"]
"app/api.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
